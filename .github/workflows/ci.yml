name: CI

on:
  push:
    branches: [master]
  pull_request:

# Un seul run par branche : un nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check "**/*.{ts,tsx}"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  contracts:
    name: Contrats (build, tests, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:build
      - run: pnpm contracts:test
      - run: pnpm contracts:typecheck
      - name: ABI du front à jour
        run: pnpm abi && git diff --exit-code lib/onchain/ctf-platform-abi.ts lib/onchain/level-artifacts.ts
