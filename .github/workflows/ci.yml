name: CI

on:
  push:
    branches: [master]
  pull_request:

# Un seul run par branche : un nouveau push annule le précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check "**/*.{ts,tsx}"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  contracts:
    name: Contrats (build, tests, types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:build
      - run: pnpm contracts:test
      - name: Tests sur le bytecode déployé (profil production)
        run: pnpm contracts:test:production
      - run: pnpm contracts:typecheck
      - name: ABI du front à jour
        run: pnpm abi && git diff --exit-code lib/onchain/ctf-platform-abi.ts lib/onchain/level-artifacts.ts lib/onchain/vault-source.ts
